<style>body{margin:0;background:#000}canvas{width:180px;height:270px;margin:1px}</style>
<script type=module>
import { createGame, flap, step, CFG } from './game.js'
import { render } from './render.js'
const mk = () => { const c = document.createElement('canvas'); c.width=400; c.height=600; document.body.append(c); return c.getContext('2d') }
let seed = 11; const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647
let g = flap(createGame('hard')); let shots = 0, i = 0
for (; i < 60 * 60 && g.phase === 'playing' && shots < 5; i++) {
  const next = g.pillars.find(p => p.x + CFG.pillarW > CFG.birdX - CFG.birdR)
  if (g.y > (next ? next.gapY + 30 : 330) && g.vy > 0) g = flap(g)
  step(g, 1 / 60, rand)
  const p5 = g.pillars.find(p => p.drift > 0)
  if (p5 && p5.x < 330 && i % 18 === 0) { render(mk(), g, { best: 0, paused: false, touch: false, muted: false }); shots++ }
}
</script>
