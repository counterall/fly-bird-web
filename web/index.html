<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1a1640">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Updraft: a one-button game. Flap a magpie through gaps between dusk-lit pillars.">
  <title>Updraft</title>
  <meta name="apple-mobile-web-app-title" content="Updraft">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <style>
    /* html gets a background too, so no white shows under mobile browser toolbars */
    html { background: #1a1640; }
    html, body { margin: 0; height: 100%; }
    body {
      background: radial-gradient(ellipse at 50% 30%, #3a2f6e, #16122e 70%);
      display: grid; place-items: center; overflow: hidden;
      height: 100dvh; touch-action: none; user-select: none; -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    canvas {
      display: block; border-radius: 14px; outline: none;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.06), 0 16px 48px rgba(0, 0, 0, 0.45);
    }
    body.fill { background: #1a1640; }
    body.fill canvas { border-radius: 0; box-shadow: none; }
    noscript { color: #fff8ee; font: 16px system-ui, sans-serif; }
  </style>
</head>
<body>
  <canvas id="game" aria-label="Updraft game: press Space or tap to flap"></canvas>
  <noscript>Updraft needs JavaScript.</noscript>
  <script type="module" src="./main.js"></script>
</body>
</html>
